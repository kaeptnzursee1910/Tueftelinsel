<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tüftelinsel">
<meta name="theme-color" content="#0f142d">
<title>Tüftelinsel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="underwater" hidden></div>

<!-- Anzeige im Spiel -->
<div id="hud" hidden>
  <div id="cross"><i></i></div>
  <div id="aim"></div>
  <div id="topbar">
    <button id="bMenu" title="Menü (Esc)">☰</button>
    <button id="bBlocks" title="Alle Blöcke (E)">🧱 <span>Blöcke</span></button>
    <span id="info"></span>
  </div>
  <div id="hotbar"></div>
  <div id="msgs"></div>
  <div id="flyinfo" hidden>🕊️ Fliegen</div>

  <!-- Touch-Steuerung -->
  <div id="touch">
    <div id="stick"><i></i></div>
    <button class="tb" id="bPlace"><span>🧱</span><em>Bauen</em></button>
    <button class="tb small" id="bBreak"><span>⛏️</span><em>Abbauen</em></button>
    <button class="tb small" id="bJump"><span>⤒</span><em>Springen</em></button>
    <button class="tb small" id="bFly"><span>🕊️</span><em>Fliegen</em></button>
    <button class="tb small" id="bDown" hidden><span>⤓</span><em>Runter</em></button>
  </div>
  <div id="lockhint" hidden>Klicke ins Bild, um weiterzuspielen</div>
  <div id="loadinfo" hidden>Insel wird geladen …</div>
</div>

<!-- Block-Menü -->
<div id="blocks" hidden><div class="panel wide"><header><h2>Blöcke</h2><button class="backbtn" data-close>Schließen ✕</button></header><div id="blockgrid"></div><p class="note">Einen Block antippen: Er kommt in das gewählte Fach der Schnellleiste.</p></div></div>

<div id="menu"></div>
<div id="loading"><div class="logo">Tüftelinsel</div><p>Lädt …</p></div>
<input type="file" id="importfile" accept=".json,application/json" hidden>

<script src="lib/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
